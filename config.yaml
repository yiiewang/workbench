# Workbench configuration
server:
  port: 8001
  static_dir: ./preview  # 用户文件目录（UI 资源 index.html/css/js/todo.html 走 embed，不在此服务）
  # 严格校验资源路径：符号链接指向 static_dir 外的文件时返回 404
  # 默认关闭符号链接支持，需通过环境变量 ALLOW_SYMLINK=true 开启
  allow_symlink: false
  hidden:
    - "index.html"
    - ".*"
    - "*.js"
    - "private"
    - "todo.html"

database:
  path: ./data/workbench.db

auth:
  token_expiry_days: 7  # 短有效期：泄漏窗口小；改短后旧 token 仍按签发时的有效期到期

# Route mapping: request path -> target
#   "/xxx"         -> 302 redirect to target path
#   "__listdir__"  -> show file listing
#   "Display Name" -> display name alias in directory listing
routes:
  "/todo": "__spa__"
  # 移动端 SPA 入口（与 frontend/src/router 中 /m 子路由一一对应；新增移动页面需同步加键）
  "/m": "__spa__"
  "/m/files": "__spa__"
  "/m/file": "__spa__"
  "/m/ai": "__spa__"
  "/m/todo": "__spa__"
  "/m/profile": "__spa__"
  "/shares": "__spa__"
  "/login": "__spa__"
  "/file": "__spa__"
  "/admin": "__spa__"
  "/index": "__listdir__"
  "/todo.html": "Todo Board"

logging:
  dir: logs
  level: info  # debug | info | warn | error

# AI 对话（OpenAI 兼容协议，key 只留在后端，前端经 /api/ai/chat 代理访问）
# api_key + base_url 均配置后 AI 入口才会启用；也可用环境变量 AI_BASE_URL / AI_API_KEY / AI_MODEL
# 敏感凭据不进仓库：启动前 export AI_API_KEY=...（见 README），此处一律留空
ai:
  base_url: https://tokenlink.woa.com/openapi/v1/chat/completions  # DeepSeek: https://api.deepseek.com/v1；Ollama: http://localhost:11434/v1
  api_key: ""  # 留空 = 关闭 AI 功能；凭据一律走环境变量 AI_API_KEY
  model: hy4
  # 工具调用（Agent 模式）：模型可调 list_dir / read_file / list_tasks / create_task，
  # 由后端执行并把结果回传模型循环决策；要求模型支持 function calling。
  # 默认关闭保持纯对话；环境变量 AI_TOOLS=true 开启
  tools: true
