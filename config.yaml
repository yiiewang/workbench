# Workbench configuration
server:
  port: 8001
  static_dir: ./preview  # 用户文件目录（UI 资源 index.html/css/js/todo.html 走 embed，不在此服务）
  # 严格校验资源路径：符号链接指向 static_dir 外的文件时返回 404
  # 默认关闭符号链接支持，需通过环境变量 ALLOW_SYMLINK=true 开启
  allow_symlink: false
  hidden:
    # - "index.html"
    # - ".*"
    # - "*.js"
    # - "private"
    # - "todo.html"

database:
  path: ./data/workbench.db

auth:
  token_expiry_days: 7  # 短有效期：泄漏窗口小；改短后旧 token 仍按签发时的有效期到期

# Route mapping: request path -> target
#   "/xxx"         -> 302 redirect to target path
#   "__listdir__"  -> show file listing
#   "Display Name" -> display name alias in directory listing
routes:
  "/jobs": "__spa__"
  "/todo": "__spa__"
  # 移动端 SPA 入口（与 frontend/src/router 中 /m 子路由一一对应；新增移动页面需同步加键）
  "/m": "__spa__"
  "/m/files": "__spa__"
  "/m/file": "__spa__"
  "/m/ai": "__spa__"
  "/m/todo": "__spa__"
  "/m/profile": "__spa__"
  "/shares": "__spa__"
  "/login": "__spa__"
  "/file": "__spa__"
  "/admin": "__spa__"
  "/index": "__listdir__"
  "/todo.html": "Todo Board"

logging:
  dir: logs
  level: info  # debug | info | warn | error

# AI（OpenAI 兼容协议，key 只留在后端，前端经 /api/ai/chat 代理访问）
# chat / embedding 两个子段互相独立——常指向不同服务（聊天网关 + 向量模型）。
# 敏感凭据不进仓库：启动前 export AI_API_KEY=... / AI_EMBEDDING_API_KEY=...（见 README）
ai:
  # 聊天模型：api_key + base_url 均配置后 AI 入口才会启用；
  # 环境变量 AI_BASE_URL / AI_API_KEY / AI_MODEL
  chat:
    base_url: https://tokenlink.woa.com/openapi/v1/chat/completions  # DeepSeek: https://api.deepseek.com/v1；Ollama: http://localhost:11434/v1
    api_key: ""  # 留空 = 关闭 AI 功能；凭据一律走环境变量 AI_API_KEY
    model: hy4
    # 工具调用（Agent 模式）：模型可调 list_dir / read_file / list_tasks / create_task，
    # 由后端执行并把结果回传模型循环决策；要求模型支持 function calling。
    # 默认关闭保持纯对话；环境变量 AI_TOOLS=true 开启
    tools: true
  # 向量模型（RAG 文件语义检索）：base_url + model 配置后启用。
  # 文件写入（上传/编辑保存/AI 写文件）自动建索引，AI 对话时自动检索相关片段
  # 注入上下文（零手动 @ 引用）。本地部署（vLLM/Ollama）api_key 可留空。
  # dim 为 Matryoshka 降维目标（Qwen3-Embedding 原生 4096，默认 1024）；
  # 改动 dim 会使全部向量作废，需 POST /api/ai/reindex 全量重建。
  # 凭据走环境变量 AI_EMBEDDING_API_KEY；另有 AI_EMBEDDING_BASE_URL / AI_EMBEDDING_MODEL / AI_EMBEDDING_DIM
  embedding:
    base_url: https://api.model.haihub.cn/v1  # 兼容网关根（自动追加 /embeddings）或完整端点两种写法
    api_key: ""  # 留空 = 凭据走环境变量 AI_EMBEDDING_API_KEY（不落仓库）
    model: Qwen3-Embedding-8B
    dim: 1024
    # max_distance: 0.9            # 相关度阈值（默认 0.9），按 rag 日志的 distance 分布微调
    judge_model: deepseek-flash  # LLM 相关性预判（可选）：距离阈值后批量过滤无关命中，留空关闭
    digest_model: deepseek-flash # 文件级摘要卡（可选）：索引时 LLM 生成语义摘要与原文块一起向量化，
    #                               # 宏观问题命中摘要（省 token），细节走原文；文件变更时才重新生成

# 定时调度（cron 引擎 + 进程内事件总线，internal/schedule）
schedule:
  enabled: true            # 开启后启动调度器
  timezone: Asia/Shanghai   # cron 表达式求值时区（IANA 名）
  todo_due_cron: "*/5 * * * *"  # Todo 到期扫描频率（5 段标准表达式）

# 通知渠道（订阅事件总线；任务到期提醒发给任务归属用户的邮箱）
notify:
  email:
    enabled: true          # 开启邮件通知
    host: smtp.qq.com       # SMTP 服务器（587 STARTTLS；465 出站常被云厂商干预不可用）
    port: 587
    user: "yiiewang@qq.com" # SMTP 认证用户名（QQ 邮箱为完整地址；个人邮箱同时兼作发件地址）
    # from: ""              # 系统发件邮箱，可选：缺省用 user（仅企业邮局/代发服务需要不同值时配置）
    from_name: "Workbench Robot" # 发件人显示名，缺省 "Workbench"
    # 收件人（to）= 任务归属用户的 email（用户管理/移动端「我的」页配置），无需在此配置
    # 授权码不落配置：启动前 export EMAIL_PASS=...（QQ 邮箱为 SMTP 授权码）
