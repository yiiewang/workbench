<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview Server</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #f5f5f5;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 2rem;
  }
  .container {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    padding: 3rem;
    max-width: 600px;
    width: 100%;
    text-align: center;
  }
  h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #1a1a1a; }
  .subtitle { color: #666; margin-bottom: 2rem; font-size: 0.95rem; }
  .links { display: flex; flex-direction: column; gap: 0.75rem; align-items: center; }
  .links a {
    display: inline-block;
    padding: 0.6rem 1.5rem;
    background: #4f46e5;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 0.95rem;
    transition: background 0.2s;
    min-width: 220px;
  }
  .links a:hover { background: #4338ca; }
  .links a.secondary { background: #e5e7eb; color: #333; }
  .links a.secondary:hover { background: #d1d5db; }
  .info {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid #eee;
    font-size: 0.85rem;
    color: #999;
  }
  code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
</style>
</head>
<body>
  <div class="container">
    <h1>Preview Server</h1>
    <p class="subtitle">A lightweight static file server with visit tracking and auth support.</p>
    <div class="links">
      <a href="/todo">Todo Board</a>
      <a href="/index">Browse All Files</a>
      <a class="secondary" href="/__stats__">Visit Statistics</a>
      <a class="secondary" href="/__map__">Route Map</a>
    </div>
    <div class="info">
      <p>Read the docs: <a href="https://github.com/yiiewang/workbench" target="_blank">github.com/yiiewang/workbench</a></p>
    </div>
  </div>
</body>
</html>
