<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workbench</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='1' width='12' height='14' rx='1' fill='%23007acc'/><path d='M6 4h4l2 2v7H4V4z' fill='%23fff' opacity='.8'/></svg>">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
  <script src="/js/common.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Login Modal -->
<div class="modal-mask" id="loginModal" style="display:none">
  <div class="modal-content">
    <div class="modal-header">用户登录</div>
    <div class="modal-body">
      <div class="form-group">
        <label>用户ID <span style="color:#e53935;">*</span></label>
        <input type="text" id="loginUserId" placeholder="请输入用户ID">
      </div>
      <div class="form-group">
        <label>密码 <span style="color:#e53935;">*</span></label>
        <input type="password" id="loginPassword" placeholder="请输入密码">
      </div>
      <div class="form-group">
        <label>组织ID <span style="color:#e53935;">*</span></label>
        <input type="text" id="loginOrgId" placeholder="请输入组织ID">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="loginCancelBtn">取消</button>
      <button class="btn btn-primary" id="loginSubmitBtn">登录</button>
    </div>
  </div>
</div>

<!-- Create Share Modal (Vue + Element Plus) -->
<div class="modal-mask share-modal" id="shareModal" style="display:none">
  <div class="modal-content" style="max-width:480px">
    <div class="modal-header">创建分享</div>
    <div class="modal-body" style="display:block;padding:20px 24px;">
      <div id="shareApp" v-cloak></div>
    </div>
  </div>
</div>

<!-- Activity Bar — 功能门户 -->
<div class="activity-bar">
  <div class="activity-item active" title="文件浏览器" id="explorerBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
    </svg>
  </div>
  <div class="activity-item" title="分享管理" id="sharePanelBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="18" cy="5" r="3"/>
      <circle cx="6" cy="12" r="3"/>
      <circle cx="18" cy="19" r="3"/>
      <path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/>
    </svg>
    <span class="badge" id="shareBadge" style="display:none"></span>
  </div>
  <div class="activity-item" title="Todo 看板" id="todoBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M9 11l3 3L22 4"/>
      <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
    </svg>
  </div>
  <div class="activity-divider"></div>
  <div class="activity-item" style="margin-top: auto;" id="userBtn" title="登录">
    <svg id="userIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    <div class="user-badge" id="userAvatar" style="display:none"></div>
  </div>
</div>

<!-- Sidebar -->
<div class="sidebar">
  <div class="tree-panel active" id="explorerPanel">
    <div class="sidebar-header">EXPLORER</div>
    <div class="file-tree" id="tree"></div>
  </div>
  <div class="share-panel" id="sharesPanel">
    <div class="sidebar-header">MY SHARES</div>
    <div class="share-list" id="shareList">
      <div class="share-panel-empty">No shares yet</div>
    </div>
  </div>
</div>

<div class="resizer" id="resizer"></div>

<!-- Main -->
<div class="main">
  <div class="tab-bar" id="tabBar">
  </div>
  <div class="tab-share" id="shareBtn" title="Create share link" style="display:none">
    <svg width="14" height="14" viewBox="0 0 16 16"><path d="M11 2.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zm-.98 4.3l1.19.88-4.42 5.64-1.21-.91 4.44-5.61zM5.5 8a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm8 5.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z" fill="currentColor"/></svg>
    <span id="shareLabel">Share</span>
  </div>
  <div class="tab-download" id="downloadBtn" title="Download this file" style="display:none">
    <svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 1a.5.5 0 01.5.5v7.793l2.146-2.147a.5.5 0 01.708.708l-3 3a.5.5 0 01-.708 0l-3-3a.5.5 0 11.708-.708L7.5 9.293V1.5A.5.5 0 018 1zM2 13.5a.5.5 0 01.5-.5h11a.5.5 0 010 1h-11a.5.5 0 01-.5-.5z" fill="currentColor"/></svg>
    <span>Download</span>
  </div>
  <div class="editor-area" id="editorArea">
    <div class="editor-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
      <span>Select a file from the Explorer to preview</span>
    </div>
  </div>
</div>

  <script src="/js/app.js"></script>

</body>
</html>
