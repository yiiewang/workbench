<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo Board - Preview Server</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f5;
    padding: 2rem;
  }
  .board {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    padding: 2rem;
  }
  h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
  .task { display: flex; gap: 0.75rem; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid #eee; }
  .task:last-child { border-bottom: none; }
  .task input[type="checkbox"] { width: 20px; height: 20px; accent-color: #4f46e5; }
  .task label { flex: 1; font-size: 0.95rem; cursor: pointer; }
  .task input:checked + label { text-decoration: line-through; color: #999; }
  .back { margin-top: 1.5rem; text-align: center; }
  .back a { color: #4f46e5; text-decoration: none; font-size: 0.9rem; }
  .back a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="board">
    <h1>Todo Board</h1>
    <div class="task">
      <input type="checkbox" id="t1" checked>
      <label for="t1">Set up the Preview Server</label>
    </div>
    <div class="task">
      <input type="checkbox" id="t2">
      <label for="t2">Customize route_config in config.json</label>
    </div>
    <div class="task">
      <input type="checkbox" id="t3">
      <label for="t3">Add your own HTML files</label>
    </div>
    <div class="task">
      <input type="checkbox" id="t4">
      <label for="t4">Enable auth with tasks.json</label>
    </div>
    <div class="back">
      <a href="/">Back to Home</a>
    </div>
  </div>
</body>
</html>
